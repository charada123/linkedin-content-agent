name: LinkedIn daily post

# Auto-posts one LinkedIn update per run using the Claude API.
# Configure ANTHROPIC_API_KEY and LINKEDIN_ACCESS_TOKEN as repository secrets
# (Settings -> Secrets and variables -> Actions). Optionally add
# LINKEDIN_AUTHOR_URN.

on:
  schedule:
    # 14:00 UTC every weekday (09:00 US Eastern). Adjust to taste.
    - cron: "0 14 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Generate only, do not publish"
        type: boolean
        default: false
      delete_urn:
        description: "Delete a post by URN (e.g. urn:li:share:123). Skips posting."
        type: string
        default: ""
      force_ad:
        description: "Publish an ad now (ignores cadence; not logged to history)"
        type: boolean
        default: false
      force_video:
        description: "Make this run an explainer video (ignores the video cadence)"
        type: boolean
        default: false

permissions:
  contents: write # to commit the updated post history

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Video posts are rendered locally with ffmpeg. Neither ffmpeg nor the
      # DejaVu fonts are guaranteed to be on the runner image, so install both
      # rather than depending on whatever happens to be preinstalled.
      - name: Install ffmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core

      - name: Install dependencies
        working-directory: agent
        run: npm install

      - name: Generate and publish
        working-directory: agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
          DRY_RUN: ${{ inputs.dry_run }}
          DELETE_URN: ${{ inputs.delete_urn }}
          FORCE_AD: ${{ inputs.force_ad }}
          FORCE_VIDEO: ${{ inputs.force_video }}
        run: |
          # Format overrides are independent of whether we publish, so that
          # "dry run" can preview an ad or a video without posting it. Dry run
          # always wins: no combination of inputs publishes when it is ticked.
          FLAGS=""
          if [ "$FORCE_AD" = "true" ]; then FLAGS="--ad"; fi
          if [ "$FORCE_VIDEO" = "true" ]; then FLAGS="--video"; fi

          if [ -n "$DELETE_URN" ]; then
            node post.mjs --delete "$DELETE_URN"
          elif [ "$DRY_RUN" = "true" ]; then
            node post.mjs $FLAGS
          else
            node post.mjs $FLAGS --post
          fi

      - name: Commit updated post history
        if: ${{ inputs.dry_run != true && inputs.delete_urn == '' && inputs.force_ad != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet agent/data/history.json; then
            git add agent/data/history.json
            git commit -m "chore: log LinkedIn post $(date -u +%Y-%m-%d)"
            git push
          fi

name: LinkedIn daily post

# Auto-posts one LinkedIn update per run using the Claude API.
# Configure ANTHROPIC_API_KEY and LINKEDIN_ACCESS_TOKEN as repository secrets
# (Settings -> Secrets and variables -> Actions). Optionally add
# LINKEDIN_AUTHOR_URN.

on:
  schedule:
    # 14:00 UTC every weekday (09:00 US Eastern). Adjust to taste.
    - cron: "0 14 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Generate only, do not publish"
        type: boolean
        default: false
      delete_urn:
        description: "Delete a post by URN (e.g. urn:li:share:123). Skips posting."
        type: string
        default: ""
      force_ad:
        description: "Publish an ad now (ignores cadence; not logged to history)"
        type: boolean
        default: false
      force_video:
        description: "Make this run an explainer video (ignores the video cadence)"
        type: boolean
        default: false

permissions:
  contents: write # to commit the updated post history
  issues: write # to raise an issue when a scheduled run fails

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Video posts are rendered locally with ffmpeg and set in Inter. Neither
      # is guaranteed to be on the runner image, so install them rather than
      # depending on whatever happens to be preinstalled. DejaVu is the
      # fallback the renderer uses if Inter is somehow unavailable.
      - name: Install ffmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-inter fonts-dejavu-core

      - name: Install dependencies
        working-directory: agent
        run: npm install

      - name: Generate and publish
        working-directory: agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
          # Optional. With these three set the agent mints a fresh access token
          # every run, so the 60-day expiry stops taking the schedule down.
          LINKEDIN_REFRESH_TOKEN: ${{ secrets.LINKEDIN_REFRESH_TOKEN }}
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          DRY_RUN: ${{ inputs.dry_run }}
          DELETE_URN: ${{ inputs.delete_urn }}
          FORCE_AD: ${{ inputs.force_ad }}
          FORCE_VIDEO: ${{ inputs.force_video }}
        run: |
          # Format overrides are independent of whether we publish, so that
          # "dry run" can preview an ad or a video without posting it. Dry run
          # always wins: no combination of inputs publishes when it is ticked.
          FLAGS=""
          if [ "$FORCE_AD" = "true" ]; then FLAGS="--ad"; fi
          if [ "$FORCE_VIDEO" = "true" ]; then FLAGS="--video"; fi

          if [ -n "$DELETE_URN" ]; then
            node post.mjs --delete "$DELETE_URN"
          elif [ "$DRY_RUN" = "true" ]; then
            node post.mjs $FLAGS
          else
            node post.mjs $FLAGS --post
          fi

      - name: Commit updated post history
        if: ${{ inputs.dry_run != true && inputs.delete_urn == '' && inputs.force_ad != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet agent/data/history.json; then
            git add agent/data/history.json
            git commit -m "chore: log LinkedIn post $(date -u +%Y-%m-%d)"
            git push
          fi

      # The schedule runs unattended, so a failure that only shows in the
      # Actions tab goes unnoticed for weeks. Keep exactly one open issue: the
      # first failure opens it, later ones comment on it, so a run of bad days
      # does not produce a pile of duplicates.
      - name: Report a failed run
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: "LinkedIn posting is failing"
        run: |
          api() {
            curl -sS -H "Authorization: Bearer $GH_TOKEN" \
                 -H "Accept: application/vnd.github+json" "$@"
          }
          open_issue=$(api "https://api.github.com/repos/$REPO/issues?state=open&per_page=100" \
            | jq -r --arg t "$TITLE" '[.[] | select(.title == $t)][0].number // empty')

          today=$(date -u +%Y-%m-%d)
          if [ -n "$open_issue" ]; then
            api -X POST "https://api.github.com/repos/$REPO/issues/$open_issue/comments" \
              -d "$(jq -n --arg b "Failed again on $today. $RUN_URL" '{body: $b}')" > /dev/null
            echo "Commented on issue #$open_issue."
          else
            body="The scheduled LinkedIn post failed on $today, so nothing was published."
            body="$body"$'\n\n'"Run: $RUN_URL"
            body="$body"$'\n\n'"The most common cause is an expired LinkedIn access token: they last about 60 days. Setting LINKEDIN_REFRESH_TOKEN, LINKEDIN_CLIENT_ID and LINKEDIN_CLIENT_SECRET lets the agent renew its own token so this stops recurring."
            body="$body"$'\n\n'"Close this issue once posting resumes."
            api -X POST "https://api.github.com/repos/$REPO/issues" \
              -d "$(jq -n --arg t "$TITLE" --arg b "$body" '{title: $t, body: $b}')" > /dev/null
            echo "Opened a new failure issue."
          fi
